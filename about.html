<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhanipurja Nepal - Navigation Demo</title>
    <style>
        :root {
            --primary-green: #1e7e34;
            --dark-green: #145222;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2ee;
            margin: 0;
            padding: 20px;
        }

        /* Navigation Bar Demo Wrapper */
        nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-green);
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links > li {
            margin-left: 25px;
            position: relative; /* Crucial for absolute positioning of the dropdown */
        }

        .nav-links a {
            color: #333;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.3s;
            padding: 8px 0;
            display: block;
        }

        .nav-links a:hover {
            color: var(--primary-green);
        }

        /* --- DROPDOWN STYLING --- */
        
        /* Dropdown Trigger Link Arrow */
        .dropdown-toggle::after {
            content: ' ▾';
            font-size: 0.8rem;
            color: var(--primary-green);
        }

        /* Dropdown Content Box */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-width: 200px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-radius: 10px;
            padding: 8px 0;
            border: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        /* Dropdown Individual Links */
        .dropdown-menu a {
            padding: 10px 18px;
            color: #444;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        /* Hover Effect on Dropdown Items */
        .dropdown-menu a:hover {
            background-color: var(--primary-green);
            color: #ffffff;
            padding-left: 24px; /* Subtle slide-right effect on hover */
        }

        /* Reveal Dropdown Menu on Mouse Hover */
        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .btn-nav {
            background-color: var(--primary-green);
            color: white !important;
            padding: 8px 18px !important;
            border-radius: 6px;
        }

        .btn-nav:hover {
            background-color: var(--dark-green);
        }
    </style>
</head>
<body>

    <!-- Demo Navigation -->
    <nav>
        <div class="logo">Dhanipurja Nepal</div>
        
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            
            <!-- ABOUT US DROPDOWN -->
            <li class="dropdown">
                <a href="#about" class="dropdown-toggle">About Us</a>
                <div class="dropdown-menu">
                    <a href="#about">Company Overview</a>
                    <a href="#team">Meet Our Team</a>
                    <a href="#why-us">Why Choose Us</a>
                </div>
            </li>

            <li><a href="#gallery">Land Photos</a></li>
            <li><a href="#listings">Properties</a></li>
            <li><a href="#contact" class="btn-nav">Contact Us</a></li>
        </ul>
    </nav>

</body>
</html>
