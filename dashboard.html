<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GharJagga - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .section h2 {
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button.btn-add {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button.btn-add:hover {
            background: #219150;
        }

        .item-list {
            margin-top: 15px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GharJagga Admin Dashboard</h1>
        <a href="index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Live Site</a>
    </div>

    <div class="container">
        <!-- Properties Management -->
        <div class="section">
            <h2>Manage Properties</h2>
            <form id="propertyForm">
                <div class="form-grid">
                    <input type="text" id="propTitle" placeholder="Property Title" required>
                    <input type="text" id="propPrice" placeholder="Price (e.g. Rs. 35 Lakhs/Aana)" required>
                    <input type="text" id="propLocation" placeholder="Location" required>
                    <select id="propType">
                        <option value="land">Land</option>
                        <option value="house">House</option>
                    </select>
                    <input type="url" id="propImg" placeholder="Image URL">
                </div>
                <button type="submit" class="btn-add"><i class="fas fa-plus"></i> Add Property</button>
            </form>
            <div class="item-list" id="adminPropertyList"></div>
        </div>

        <!-- Videos Management -->
        <div class="section">
            <h2>Manage Video Tours</h2>
            <form id="videoForm">
                <div class="form-grid">
                    <input type="text" id="vidTitle" placeholder="Video Title" required>
                    <input type="url" id="vidUrl" placeholder="YouTube Embed URL (https://www.youtube.com/embed/...)" required>
                </div>
                <button type="submit" class="btn-add"><i class="fas fa-plus"></i> Add Video</button>
            </form>
            <div class="item-list" id="adminVideoList"></div>
        </div>

        <!-- Team Management -->
        <div class="section">
            <h2>Manage Team Members</h2>
            <form id="teamForm">
                <div class="form-grid">
                    <input type="text" id="teamName" placeholder="Member Name" required>
                    <input type="text" id="teamRole" placeholder="Role / Position" required>
                    <input type="url" id="teamImg" placeholder="Photo URL">
                </div>
                <button type="submit" class="btn-add"><i class="fas fa-plus"></i> Add Team Member</button>
            </form>
            <div class="item-list" id="adminTeamList"></div>
        </div>

        <!-- Reviews Management -->
        <div class="section">
            <h2>Manage Client Reviews</h2>
            <form id="reviewForm">
                <div class="form-grid">
                    <input type="text" id="revName" placeholder="Client Name" required>
                    <select id="revRating">
                        <option value="5">5 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="3">3 Stars</option>
                    </select>
                    <input type="text" id="revText" placeholder="Review Text" required>
                </div>
                <button type="submit" class="btn-add"><i class="fas fa-plus"></i> Add Review</button>
            </form>
            <div class="item-list" id="adminReviewList"></div>
        </div>
    </div>

    <script>
        // Default initial data setup
        const defaults = {
            properties: [
                { id: 1, title: 'Plot 1 - Danchhi', price: 'Rs. 35 Lakhs/Aana', location: 'Danchhi, Kathmandu', type: 'land', img: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80' },
                { id: 2, title: 'Plot 2 - Mulpani', price: 'Rs. 28 Lakhs/Aana', location: 'Mulpani, Kathmandu', type: 'land', img: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80' }
            ],
            videos: [
                { id: 1, title: 'Danchhi Land Tour', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
            ],
            team: [
                { id: 1, name: 'Ram Shrestha', role: 'Senior Agent', img: 'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=200&q=80' }
            ],
            reviews: [
                { id: 1, name: 'Hari Sharma', text: 'Great service! Found my land quickly.', rating: 5 }
            ]
        };

        function getItem(key) {
            const data = localStorage.getItem(key);
            if (!data) {
                localStorage.setItem(key, JSON.stringify(defaults[key]));
                return defaults[key];
            }
            return JSON.parse(data);
        }

        function setItem(key, val) {
            localStorage.setItem(key, JSON.stringify(val));
            renderAll();
        }

        // Render Functions
        function renderAll() {
            // Properties
            const properties = getItem('properties');
            document.getElementById('adminPropertyList').innerHTML = properties.map(p => `
                <div class="item-row">
                    <div><strong>${p.title}</strong> - ${p.price} (${p.location})</div>
                    <button class="btn-delete" onclick="deleteItem('properties', ${p.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
            `).join('');

            // Videos
            const videos = getItem('videos');
            document.getElementById('adminVideoList').innerHTML = videos.map(v => `
                <div class="item-row">
                    <div><strong>${v.title}</strong> (${v.url})</div>
                    <button class="btn-delete" onclick="deleteItem('videos', ${v.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
            `).join('');

            // Team
            const team = getItem('team');
            document.getElementById('adminTeamList').innerHTML = team.map(t => `
                <div class="item-row">
                    <div><strong>${t.name}</strong> - ${t.role}</div>
                    <button class="btn-delete" onclick="deleteItem('team', ${t.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
            `).join('');

            // Reviews
            const reviews = getItem('reviews');
            document.getElementById('adminReviewList').innerHTML = reviews.map(r => `
                <div class="item-row">
                    <div><strong>${r.name}</strong> (${r.rating} Stars): "${r.text}"</div>
                    <button class="btn-delete" onclick="deleteItem('reviews', ${r.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
            `).join('');
        }

        function deleteItem(key, id) {
            const items = getItem(key).filter(i => i.id !== id);
            setItem(key, items);
        }

        // Forms Handlers
        document.getElementById('propertyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const items = getItem('properties');
            items.push({
                id: Date.now(),
                title: document.getElementById('propTitle').value,
                price: document.getElementById('propPrice').value,
                location: document.getElementById('propLocation').value,
                type: document.getElementById('propType').value,
                img: document.getElementById('propImg').value
            });
            setItem('properties', items);
            e.target.reset();
        });

        document.getElementById('videoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const items = getItem('videos');
            items.push({
                id: Date.now(),
                title: document.getElementById('vidTitle').value,
                url: document.getElementById('vidUrl').value
            });
            setItem('videos', items);
            e.target.reset();
        });

        document.getElementById('teamForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const items = getItem('team');
            items.push({
                id: Date.now(),
                name: document.getElementById('teamName').value,
                role: document.getElementById('teamRole').value,
                img: document.getElementById('teamImg').value
            });
            setItem('team', items);
            e.target.reset();
        });

        document.getElementById('reviewForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const items = getItem('reviews');
            items.push({
                id: Date.now(),
                name: document.getElementById('revName').value,
                rating: parseInt(document.getElementById('revRating').value),
                text: document.getElementById('revText').value
            });
            setItem('reviews', items);
            e.target.reset();
        });

        window.addEventListener('DOMContentLoaded', renderAll);
    </script>
</body>
</html>
